# Read by the Render Configuration Compiler via CapabilityManifest
# (packages/schemas/json/capability_manifest.schema.json) once a real
# IVideoEngine adapter for this engine exists and VIDEO_ENGINE=wan2.2-ti2v-5b
# is selected. No such adapter exists yet - see
# models/registry.yaml's `status: training-target` note for this engine
# and docs/adr/0024-wan22-real-training-backend.md. This manifest exists
# now so training.registry.validate_capability_manifest() has a real,
# checkable manifest to validate a trained LoRA checkpoint's
# ModelVersionRecord against before promotion (registry.records.PromotionStatus),
# per the same gate wan2.1's manifest already passes through.
#
# Values mirror BASE_MODEL_REGISTRY["wan2.2-ti2v-5b"]
# (services/training/src/training/config.py) - keep the two in sync.

engine_id: wan2.2-ti2v-5b
engine_version: "2.2.0"
license: Apache-2.0

modes:
  - text_to_video
  - image_to_video

max_shot_duration_sec: 5.0
min_shot_duration_sec: 1.0

resolutions:
  - "960x544"

fps_options: [16]

motion_strength_range: [0, 100]

supports_negative_prompt: true
supports_seed: true
supports_conditioning_images: true
max_conditioning_images: 1

gpu_requirements:
  min_vram_gb: 16
  recommended_gpu: "NVIDIA RTX 4090 (24GB) or better; ~16-24GB reported by musubi-tuner community fine-tunes with fp8 + block-swap"

# Placeholder - fill in once a real training/inference run measures this.
average_render_seconds_per_shot: null
