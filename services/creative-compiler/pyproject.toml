[project]
name = "creative-compiler"
version = "0.1.0"
description = "Creative Compiler orchestrator: DirectorPlan -> Storyboard (gate 1) -> RenderPlan (gate 2)"
requires-python = ">=3.11"
dependencies = [
  "schemas",
  "camera-engine",
  "motion-engine",
  "lighting-engine",
  "style-engine",
  "storyboard-generator",
  "render-config-compiler",
  "director-memory",
  "video-engine-sdk",
]

[tool.uv.sources]
schemas = { workspace = true }
camera-engine = { workspace = true }
motion-engine = { workspace = true }
lighting-engine = { workspace = true }
style-engine = { workspace = true }
storyboard-generator = { workspace = true }
render-config-compiler = { workspace = true }
director-memory = { workspace = true }
video-engine-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_compiler"]
