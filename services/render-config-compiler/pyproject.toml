[project]
name = "render-config-compiler"
version = "0.1.0"
description = "Render Configuration Compiler"
requires-python = ">=3.11"
dependencies = [
  "schemas",
  "video-engine-sdk",
]

[tool.uv.sources]
schemas = { workspace = true }
video-engine-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render_config_compiler"]
