[project]
name = "training"
version = "0.1.0"
description = "Phase 9 Preparation: dataset pipeline, model registry, evaluation framework, and training configuration for the Sallehly custom foundation model track. No GPU, no model downloads, no training execution - see docs/adr/0021-phase9-preparation.md."
requires-python = ">=3.11"
dependencies = [
  "video-engine-sdk",
  "pyyaml>=6.0",
]

[tool.uv.sources]
video-engine-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
