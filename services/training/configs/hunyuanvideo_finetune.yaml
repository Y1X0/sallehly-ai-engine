schema_version: '1.0'
run_id: hunyuanvideo-lora-v1
base_model_id: hunyuanvideo
base_model_revision: '1.0'
strategy: lora
dataset_version: REPLACE_WITH_REAL_DATASET_VERSION_ID
resolution: 1280x720
fps: 24
max_frames: 129
learning_rate: 5.0e-05
batch_size: 1
gradient_accumulation_steps: 16
max_train_steps: 4000
mixed_precision: bf16
min_vram_gb: 60.0
gpu_count: 2
checkpoint_every_steps: 250
eval_every_steps: 250
seed: 42
lora:
  rank: 16
  alpha: 32
  target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
  dropout: 0.0
notes: HunyuanVideo (Tencent Hunyuan Community License) - a real 13B-parameter open
  model, but its license does NOT apply in the EU/UK/South Korea and requires a separate
  Tencent license above 100M MAU; outputs may not be used to train a competing model.
  Verify current license terms before training - checked via web search 2026-07-25,
  see BASE_MODEL_REGISTRY['hunyuanvideo'].license_notes. min_vram_gb/gpu_count reflect
  its substantially larger footprint than Wan2.1.
