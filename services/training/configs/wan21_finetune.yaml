schema_version: '1.0'
run_id: wan21-lora-v1
base_model_id: wan2.1
base_model_revision: 2.1.0
strategy: lora
dataset_version: REPLACE_WITH_REAL_DATASET_VERSION_ID
resolution: 1280x720
fps: 24
max_frames: 120
learning_rate: 0.0001
batch_size: 1
gradient_accumulation_steps: 8
max_train_steps: 4000
mixed_precision: bf16
min_vram_gb: 24.0
gpu_count: 1
checkpoint_every_steps: 250
eval_every_steps: 250
seed: 42
lora:
  rank: 16
  alpha: 32
  target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
  dropout: 0.0
notes: Wan2.1 (Apache-2.0, Alibaba) is this project's existing incumbent engine (Wan21Adapter,
  WAN21_CONTAINER_IMAGE) - the lowest-risk base to fine-tune first since its license
  and integration are already proven. Resolution/fps mirror Wan21Adapter's own CapabilityManifest.
  Not executable without a real GPU, real Wan2.1 weights, and a real dataset - see
  docs/adr/0021-phase9-preparation.md.
