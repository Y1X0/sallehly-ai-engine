[project]
name = "cinematic-intelligence"
version = "0.1.0"
description = "Cinematic Intelligence Layer (Phase 7): Character/Object/Environment Consistency Engines, Scene/Camera Continuity Engines, Style Lock, Reference Image Engine, Prompt Intelligence Engine, Temporal Memory Engine, Director Memory Graph, Scene Quality Analyzer, Automatic Repair Engine"
requires-python = ">=3.11"
dependencies = [
  "schemas",
  "config-sdk",
  "cinematic-intelligence-sdk",
]

[tool.uv.sources]
schemas = { workspace = true }
config-sdk = { workspace = true }
cinematic-intelligence-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinematic_intelligence"]
