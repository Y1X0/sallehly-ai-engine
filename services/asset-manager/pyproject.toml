[project]
name = "asset-manager"
version = "0.1.0"
description = "Asset Manager"
requires-python = ">=3.11"
dependencies = [
  "schemas",
  "storage-sdk",
]

[tool.uv.sources]
schemas = { workspace = true }
storage-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_manager"]
