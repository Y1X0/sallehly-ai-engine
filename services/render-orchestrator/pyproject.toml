[project]
name = "render-orchestrator"
version = "0.1.0"
description = "GenerationPipeline (Phase 3) + ProjectLifecycle/ProjectOrchestrator (Phase 4) + Temporal workflow"
requires-python = ">=3.11"
dependencies = [
  "schemas",
  "video-engine-sdk",
  "asset-manager",
  "ai-director",
  "creative-compiler",
  "director-memory",
  "persistence",
  "post-processing",
  "export-service",
  "cinematic-intelligence",
  "temporalio>=1.30.0",
]

[tool.uv.sources]
schemas = { workspace = true }
video-engine-sdk = { workspace = true }
asset-manager = { workspace = true }
ai-director = { workspace = true }
creative-compiler = { workspace = true }
director-memory = { workspace = true }
persistence = { workspace = true }
post-processing = { workspace = true }
export-service = { workspace = true }
cinematic-intelligence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render_orchestrator"]
