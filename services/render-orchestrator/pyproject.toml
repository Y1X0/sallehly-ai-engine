[project]
name = "render-orchestrator"
version = "0.1.0"
description = "Render Orchestrator"
requires-python = ">=3.11"
dependencies = [
  "schemas",
  "video-engine-sdk",
  "asset-manager",
]

[tool.uv.sources]
schemas = { workspace = true }
video-engine-sdk = { workspace = true }
asset-manager = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render_orchestrator"]
