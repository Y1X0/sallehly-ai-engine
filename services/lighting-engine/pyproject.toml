[project]
name = "lighting-engine"
version = "0.1.0"
description = "Lighting Engine (Lighting Planner)"
requires-python = ">=3.11"
dependencies = [
  "schemas",
]

[tool.uv.sources]
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lighting_engine"]
