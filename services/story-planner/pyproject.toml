[project]
name = "story-planner"
version = "0.1.0"
description = "CreativeBrief -> StoryOutline (narrative arc + scene skeleton)"
requires-python = ">=3.11"
dependencies = [
  "llm-providers",
  "prompt-engine",
  "schemas",
  "jsonschema>=4.21",
]

[tool.uv.sources]
llm-providers = { workspace = true }
prompt-engine = { workspace = true }
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_planner"]
