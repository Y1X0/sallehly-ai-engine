[project]
name = "ai-director"
version = "0.1.0"
description = "Creative Director layer: brief -> DirectorPlan, via any ILLMProvider"
requires-python = ">=3.11"
dependencies = [
  "llm-providers",
  "schemas",
  "jsonschema>=4.21",
]

[tool.uv.sources]
llm-providers = { workspace = true }
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_director"]
