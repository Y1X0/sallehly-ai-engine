[project]
name = "video-engine-adapter"
version = "0.1.0"
description = "Concrete IVideoEngine and IComputeProvider implementations (Wan2.1, RunPod, Vast.ai, local)"
requires-python = ">=3.11"
dependencies = [
  "video-engine-sdk",
  "config-sdk",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Real (not mock) local Wan inference - LocalInferenceProvider /
# video_engine_adapter.inference.wan_inference. Mirrors
# services/training's own `gpu-training` extra: deliberately NOT a base
# dependency, so every environment that never selects
# COMPUTE_PROVIDER=local-inference stays free of torch/diffusers
# entirely (LocalProvider/RunPodProvider need neither).
real-inference = [
  "torch>=2.3",
  "diffusers>=0.31",
  "transformers>=4.44",
  "tokenizers>=0.19",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  # Required by wan_inference.build_real_pipeline()'s enable_model_cpu_offload()
  # call (diffusers raises ImportError without it) - added after a real
  # 16GB Kaggle GPU run confirmed the full bf16 pipeline left resident on
  # GPU via .to("cuda") consumes ~15.6GB by itself, leaving no room for
  # generation; cpu offload is diffusers' own built-in fix for that.
  "accelerate>=0.30",
]

[tool.uv.sources]
video-engine-sdk = { workspace = true }
config-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_engine_adapter"]
