[project]
name = "shot-planner"
version = "0.1.0"
description = "Shot Planner"
requires-python = ">=3.11"
dependencies = [
  "schemas",
]

[tool.uv.sources]
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shot_planner"]
