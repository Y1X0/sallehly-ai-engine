[project]
name = "quota-sdk"
version = "0.1.0"
description = "IQuotaEnforcer abstraction (Phase 8 WP5) - InMemoryQuotaEnforcer (default) and RedisQuotaEnforcer behind the same interface"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quota_sdk"]
