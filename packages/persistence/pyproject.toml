[project]
name = "persistence"
version = "0.1.0"
description = "Project persistence abstraction (IProjectStore) - the top-level aggregate the API reads/writes"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persistence"]
