[project]
name = "cache-sdk"
version = "0.1.0"
description = "ICache abstraction (Phase 8 WP3) - InMemoryCache (default) and RedisCache behind the same interface"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_sdk"]
