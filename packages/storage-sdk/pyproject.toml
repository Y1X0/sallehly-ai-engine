[project]
name = "storage-sdk"
version = "0.1.0"
description = "IStorageProvider abstraction for platform-owned asset bytes (local dev + S3-compatible implementations)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage_sdk"]
