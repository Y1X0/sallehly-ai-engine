[project]
name = "rate-limit-sdk"
version = "0.1.0"
description = "IRateLimiter abstraction (Phase 8 WP5) - InMemoryRateLimiter (default) and RedisRateLimiter behind the same interface"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rate_limit_sdk"]
