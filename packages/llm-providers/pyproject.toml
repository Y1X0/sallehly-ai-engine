[project]
name = "llm-providers"
version = "0.1.0"
description = "Provider-agnostic LLM interface (ILLMProvider) for the AI Director layer"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_providers"]
