[project]
name = "config-sdk"
version = "0.1.0"
description = "Config SDK"
requires-python = ">=3.11"
dependencies = [
  "schemas",
  "pydantic-settings>=2.3",
]

[tool.uv.sources]
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_sdk"]
