[project]
name = "prompt-engine"
version = "0.1.0"
description = "Versioned prompt template loading/rendering for AI Director LLM-backed stages"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_engine"]
