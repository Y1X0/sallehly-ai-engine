[project]
name = "api"
version = "0.1.0"
description = "Public/internal API gateway (BFF)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "schemas",
  "config-sdk",
  "ai-director",
  "creative-compiler",
  "director-memory",
  "llm-providers",
  "render-orchestrator",
  "persistence",
  "asset-manager",
  "video-engine-adapter",
  "video-engine-sdk",
  "cinematic-intelligence",
  "auth",
  "storage-sdk",
  "cache-sdk",
  "observability",
  "rate-limit-sdk",
  "quota-sdk",
  "python-multipart>=0.0.9",
]

[tool.uv.sources]
schemas = { workspace = true }
config-sdk = { workspace = true }
ai-director = { workspace = true }
creative-compiler = { workspace = true }
director-memory = { workspace = true }
llm-providers = { workspace = true }
render-orchestrator = { workspace = true }
persistence = { workspace = true }
asset-manager = { workspace = true }
video-engine-adapter = { workspace = true }
video-engine-sdk = { workspace = true }
cinematic-intelligence = { workspace = true }
auth = { workspace = true }
storage-sdk = { workspace = true }
cache-sdk = { workspace = true }
observability = { workspace = true }
rate-limit-sdk = { workspace = true }
quota-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
