[project]
name = "sallehly-ai-video-engine"
version = "0.1.0"
description = "AI-directed cinematic video generation platform (workspace root)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
  "apps/*",
  "services/*",
  "packages/*",
]
# Not yet Python packages (docs-only placeholders for future phases):
exclude = [
  "apps/web-dashboard",
  "services/training",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
