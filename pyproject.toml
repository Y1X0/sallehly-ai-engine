[project]
name = "sallehly-ai-video-engine"
version = "1.0.0"
description = "AI-directed cinematic video generation platform (workspace root)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
  "apps/*",
  "services/*",
  "packages/*",
]
# Not yet a Python package (docs-only placeholder):
exclude = [
  "apps/web-dashboard",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "moto[server]>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
