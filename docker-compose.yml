name: sallehly-ai-video-engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sallehly
      POSTGRES_PASSWORD: sallehly
      POSTGRES_DB: video_engine
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data

  # S3-compatible object storage for local dev (stands in for R2/S3 in prod)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sallehly
      MINIO_ROOT_PASSWORD: sallehly123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker-data/minio:/data

  # Durable workflow engine backing the render orchestrator (see ADR 0004)
  temporal:
    image: temporalio/admin-tools:latest
    profiles: ["temporal"]
    command: ["temporal", "server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
